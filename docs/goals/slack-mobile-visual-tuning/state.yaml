# Goal Maker v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Slack Mobile Visual Tuning"
  slug: "slack-mobile-visual-tuning"
  kind: specific
  tranche: "Observe current Slack/HARE visual behavior, choose the first safe mobile-readability tuning slice, implement it if needed, verify it, and audit the result."
  status: done

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Observe current Slack/HARE visual implementation and runtime behavior with mobile readability in mind."
    inputs:
      - "docs/superpowers/specs/2026-05-30-tension-fiber-material-design.md"
      - "docs/superpowers/specs/2026-05-30-tension-fiber-visual-punch-design.md"
      - "src/ReplicatedStorage/TDShared/GameConfig.lua"
      - "src/ServerScriptService/TDServer.server.lua"
      - "src/StarterPlayer/StarterPlayerScripts/TDUIClient.client.lua"
      - "Roblox Studio Play observation through MCP when available"
    constraints:
      - "Read-only."
      - "Do not edit implementation files."
      - "Gather evidence before recommending numeric tuning."
      - "Focus on Slack sag visibility, blue absorb ripple visibility, HARE hardening visibility, and mobile screen clarity."
    expected_output:
      - "Current relevant config values"
      - "Studio runtime observation summary"
      - "Whether Slack state can be produced and observed through MCP"
      - "Mobile readability risks"
      - "Candidate Worker task with exact allowed_files, verify, and stop_if if tuning is needed"
    receipt:
      result: done
      summary: "Static source inspection found Slack/HARE visual punch wired, but runtime Studio observation could not run because no active Roblox Studio MCP instance was connected."
      current_config_values:
        SlackDistance: 8
        BeamCurveSlack: 4.6
        BeamWidthSlack: 1.25
        BeamSlackTransparency: 0.32
        SlackAbsorbRippleSize: 9
        SlackAbsorbRippleDuration: 0.34
        BeamWidthHareBonus: 1.18
        BeamHareTransparency: 0.0
        HareHardeningRingSize: 16
        HareHardeningRingDuration: 0.30
        HareShockwaveSize: 22
        HareShockwaveDuration: 0.52
        HareGlowBrightness: 4.4
        HareTrailLifetime: 0.56
      implementation_summary:
        - "TDServer updates Beam width/transparency/curve/color per tension state."
        - "Slack hit spawns TD_SlackAbsorbRipple at the contact point."
        - "HARE hit spawns TD_HareShockwave and TD_HareHardeningRing, then pulses arena."
        - "Ball color, point light, and trail are strengthened for HARE and tinted for Slack."
        - "TDUIClient renders net guidance and floating SLACK!/HARE!! callouts with mobile sizes."
      mobile_readability_risks:
        - "Slack beam is much narrower than normal, 1.25 vs 2.2, and more transparent, so it may be too subtle on mobile despite BeamCurveSlack 4.6."
        - "Slack absorb ripple lasts only 0.34s and is floor-level, so it may be easy to miss on mobile."
        - "HARE hardening ring is smaller/shorter than the existing shockwave, 16/0.30s vs 22/0.52s, so distinction may be weak."
        - "Solo ghost testing can produce HARE hit logic, but HARE beam hardening uses countRealPinning, so solo tests may not show the gold thick beam."
        - "Slack is not naturally produced by default solo ghost spacing; observing Slack likely needs two real players or deliberate Studio setup."
      runtime_observation:
        status: blocked
        reason: "Roblox Studio MCP returned no active Studio instances."
        slack_state_observable_through_mcp: "unknown_until_studio_active"
      verification:
        - cmd: "node scripts/verify-v06-guided-party.mjs"
          status: pass
        - cmd: "rojo build default.project.json --output tension-doubles-pinto-hare.rbxlx"
          status: pass
      evidence:
        - "src/ReplicatedStorage/TDShared/GameConfig.lua"
        - "src/ServerScriptService/TDServer.server.lua"
        - "src/StarterPlayer/StarterPlayerScripts/TDUIClient.client.lua"
        - "scripts/verify-v06-guided-party.mjs"
      worker_likely_needed: true
      candidate_worker_task:
        objective: "Tune only numeric Slack/HARE visual config for mobile readability after Studio observation, keeping existing server behavior and HUD logic unchanged."
        allowed_files:
          - "src/ReplicatedStorage/TDShared/GameConfig.lua"
        verify:
          - "node scripts/verify-v06-guided-party.mjs"
          - "rojo build default.project.json --output tension-doubles-pinto-hare.rbxlx"
          - "Studio Play: observe Slack beam sag/ripple and HARE ring/beam; confirm no Lua errors."
        stop_if:
          - "Need to change server logic such as HARE beam pin counting or forced Slack setup."
          - "Studio runtime/MCP remains unavailable for visual validation."
          - "Tuning obscures ball visibility or crowds mobile HUD."
          - "Rojo build or source verifier fails twice."
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Decide the first safe tuning slice by impact, confidence, reversibility, and verification strength."
    inputs:
      - "T001 receipt"
      - "Original user request: make Slack sag and absorb ripple readable, especially for mobile players"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Prefer config-only changes if they address the observation."
      - "Reject changes that obscure the ball or make mobile HUD clutter worse."
    expected_output:
      - "Decision"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Deferred tasks"
    receipt:
      result: done
      decision: "Require Studio reconnect before tuning. Source-only numeric prep is not aligned because the user explicitly wants actual Slack state observation and T001 could not observe runtime Slack."
      evidence:
        - "T001 source verifier passed and Rojo build passed."
        - "T001 found Slack/HARE visuals are already wired through GameConfig numeric values."
        - "T001 runtime observation was blocked because Roblox Studio MCP had no active Studio instance."
        - "T001 risks are visual and observation-dependent: Slack beam/ripple subtlety and HARE ring distinction."
      next_allowed_task: T003
      exact_worker_objective: "With an active Roblox Studio MCP/Play session, observe actual Slack sag and absorb ripple on a mobile/small viewport; if readability is weak, tune only Slack/HARE numeric visual config in GameConfig.lua, preserving ball visibility and HUD clarity."
      allowed_files:
        - "src/ReplicatedStorage/TDShared/GameConfig.lua"
      verify:
        - "node scripts/verify-v06-guided-party.mjs"
        - "rojo build default.project.json --output tension-doubles-pinto-hare.rbxlx"
        - "Studio Play via MCP: reproduce/observe Slack state, confirm sagging beam and TD_SlackAbsorbRipple readability on mobile/small viewport, confirm no Lua errors."
        - "Studio Play via MCP: spot-check HARE feedback still readable and does not obscure ball/mobile HUD."
      stop_if:
        - "Roblox Studio MCP still has no active Studio instance."
        - "Slack state cannot be produced or observed well enough to justify tuning."
        - "Needed change is outside GameConfig.lua."
        - "Need server logic changes, forced Slack setup code, HUD redesign, particles/assets, or gameplay semantics changes."
        - "Any tuning obscures the ball, partner net, landing target, score reason, PIN/HARE feedback, or mobile HUD."
        - "Local verifier or Rojo build fails twice for the same reason."
      deferred_tasks:
        - "Mobile HUD/layout redesign."
        - "HARE beam hardening logic changes for solo testing."
        - "Device-only human mobile QA beyond Studio/MCP observation."
  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: default
    objective: "With an active Roblox Studio MCP/Play session, observe actual Slack sag and absorb ripple on a mobile/small viewport; if readability is weak, tune only Slack/HARE numeric visual config in GameConfig.lua, preserving ball visibility and HUD clarity."
    allowed_files:
      - "src/ReplicatedStorage/TDShared/GameConfig.lua"
    verify:
      - "node scripts/verify-v06-guided-party.mjs"
      - "rojo build default.project.json --output tension-doubles-pinto-hare.rbxlx"
      - "Studio Play via MCP: reproduce/observe Slack state, confirm sagging beam and TD_SlackAbsorbRipple readability on mobile/small viewport, confirm no Lua errors."
      - "Studio Play via MCP: spot-check HARE feedback still readable and does not obscure ball/mobile HUD."
    stop_if:
      - "Need files outside allowed_files."
      - "Need product direction beyond Slack/mobile readability."
      - "Verification fails twice for the same reason."
      - "Studio runtime cannot be controlled enough to validate the selected change."
    receipt:
      result: done
      changed_files:
        - "src/ReplicatedStorage/TDShared/GameConfig.lua"
      commands:
        - cmd: "Studio Play via MCP with temporary SlackDistance=20"
          status: pass
          note: "Observed FIBER SAG guidance, SLACK! callout, beam curve 4.6/width 1.25 before tuning, TD_SlackAbsorbRipple max size 9."
        - cmd: "Studio Play via MCP after tuning with temporary SlackDistance=20"
          status: pass
          note: "Observed FIBER SAG guidance, SLACK! callout, beam curve 5.4/width 1.45, TD_SlackAbsorbRipple max size 12."
        - cmd: "mcp__Roblox_Studio.get_console_output"
          status: pass
          note: "No game Lua errors; only known Roblox Assistant CornerRadius warnings."
        - cmd: "node scripts/verify-v06-guided-party.mjs"
          status: pass
        - cmd: "rojo build default.project.json --output tension-doubles-pinto-hare.rbxlx"
          status: pass
        - cmd: "mobile Slack config threshold check"
          status: pass
          note: "BeamCurveSlack >= 5.2, BeamWidthSlack >= 1.4, BeamSlackTransparency <= 0.26, SlackAbsorbRippleSize >= 11, SlackAbsorbRippleDuration >= 0.42."
      summary: "Tuned Slack visual config for mobile readability: stronger sag, thicker/less transparent Slack beam, larger and longer absorb ripple. Restored Studio-only SlackDistance test override after observation."
  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit whether the current tranche satisfies Slack/mobile visual readability."
    inputs:
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "Original user request"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Reject completion if a required Worker task is still queued or active."
    expected_output:
      - "complete | not_complete"
      - "missing evidence"
      - "mapping to Slack/mobile readability"
      - "next task if not complete"
    receipt:
      result: done
      decision: complete
      evidence:
        - "T001 mapped existing Slack/HARE config and identified mobile readability risks."
        - "T002 required Studio MCP observation before any numeric tuning."
        - "T003 changed only src/ReplicatedStorage/TDShared/GameConfig.lua."
        - "T003 raised BeamCurveSlack 4.6->5.4, BeamWidthSlack 1.25->1.45, lowered BeamSlackTransparency 0.32->0.24, raised SlackAbsorbRippleSize 9->12, and SlackAbsorbRippleDuration 0.34->0.44."
        - "T003 recorded Studio Play via MCP before and after tuning, with temporary SlackDistance=20 restored afterward."
        - "T003 recorded no game Lua errors, source verifier pass, Rojo build pass, and config threshold pass."
      mapping_to_goal:
        - "Slack sag readability improved with stronger curve and wider/less transparent Slack beam, observed before/after in Studio."
        - "Blue absorb ripple readability improved with larger and longer ripple, observed before/after in Studio."
        - "Mobile-first minimal slice stayed config-only in GameConfig.lua; no HUD/server/gameplay changes."
        - "No heavy particles/assets were added, and Studio log showed no game Lua errors."
      missing_evidence: []
      residual_risk:
        - "No physical-device mobile QA or screenshot artifact is recorded; acceptance rests on Studio MCP observation and config thresholds."
        - "Slack was forced for observation with temporary SlackDistance=20, so natural two-player Slack frequency/readability remains indirectly covered."
      next_allowed_task: null

checks:
  dirty_fingerprint: unknown
  last_verification:
    result: pass
    task: T003
    commands:
      - "node scripts/verify-v06-guided-party.mjs"
      - "rojo build default.project.json --output tension-doubles-pinto-hare.rbxlx"
      - "Studio Play via MCP observed Slack before/after tuning"
